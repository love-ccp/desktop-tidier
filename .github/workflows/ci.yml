name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (fmt + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v2
      - run: just fmt
      - run: just lint
      - run: just test

  windows-build:
    name: Windows (release build + artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # aws-lc-rs（reqwest rustls 后端）在 Windows 需要 nasm 汇编器
      - uses: ilammy/setup-nasm@v1
      # 先只做类型检查（不链接），用于区分「编译错误」与「链接错误」
      - run: cargo check --target x86_64-pc-windows-msvc
      # 静态 CRT（.cargo/config.toml）产出单文件 exe
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: course-organizer-windows-x64
          path: target/x86_64-pc-windows-msvc/release/course-organizer.exe
          if-no-files-found: error
